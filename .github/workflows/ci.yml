name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      # Valida la logica del backend con los tests unitarios.
      - name: Run backend tests
        run: npm test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      # Comprueba que Vite puede compilar la aplicacion React.
      - name: Build frontend
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Dockerfile - build image
        # build-arg VITE_API_URL passed from secrets if exists (optional)
        run: |
          docker build \
            --build-arg VITE_API_URL="${{ secrets.VITE_API_URL }}" \
            -t matamounstruos-frontend:ci \
            -f frontend/Dockerfile \
            frontend

      - name: Docker image size
        if: success()
        run: docker images matamounstruos-frontend:ci --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"
