services:
  mariadb:
    image: mariadb:11
    container_name: matamounstruos-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ../backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ../backend/db/seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql
    networks:
      - matamounstruos-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: matamounstruos-backend
    restart: unless-stopped
    environment:
      PORT: ${PORT}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      NODE_ENV: ${NODE_ENV}
    depends_on:
      - mariadb

    # Expone el backend Docker en localhost:3001.
    ports:
      - "3001:3000"
    networks:
      - matamounstruos-network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: matamounstruos-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - matamounstruos-network

volumes:
  mariadb_data:

networks:
  matamounstruos-network:
